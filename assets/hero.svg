<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Terminal: whoami - Hossam Mohsen, backend engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="0.5" stop-color="#bc8cff"/><stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <style>
      text{white-space:pre;font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:17px}
      .p{fill:#3fb950}.c{fill:#e6edf3}.d{fill:#8b949e}.k{fill:#79c0ff}.s{fill:#a5d6ff}.o{fill:#ffa657}.m{fill:#d2a8ff}
      .l{opacity:0;animation:show .01s forwards}
      @keyframes show{to{opacity:1}}
      .l1{animation-delay:.3s}.l2{animation-delay:1.2s}.l3{animation-delay:1.5s}.l4{animation-delay:1.8s}
      .l5{animation-delay:2.1s}.l6{animation-delay:2.4s}.l7{animation-delay:3.2s}.l8{animation-delay:3.5s}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .bar{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3s ease-out forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="900" height="330" rx="14" fill="url(#bg)" stroke="#30363d"/>
  <rect x="0" y="0" width="900" height="38" rx="14" fill="#21262d"/>
  <rect x="0" y="24" width="900" height="14" fill="#21262d"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/><circle cx="46" cy="19" r="6" fill="#ffbd2e"/><circle cx="68" cy="19" r="6" fill="#27c93f"/>
  <text x="450" y="24" text-anchor="middle" class="d" style="font-size:13px">hossam@backend: ~</text>
  <line class="bar" x1="0" y1="38" x2="900" y2="38" stroke="url(#glow)" stroke-width="2"/>

  <g class="l l1"><text x="28" y="76"><tspan class="p">➜</tspan> <tspan class="k">~</tspan> <tspan class="c">whoami</tspan></text></g>
  <g class="l l2"><text x="28" y="106" class="c" style="font-size:22px;font-weight:700">Hossam Mohsen <tspan class="d" style="font-size:15px;font-weight:400">// Software Engineer</tspan></text></g>
  <g class="l l3"><text x="28" y="134"><tspan class="d">role     </tspan><tspan class="s">"B.Sc. Computer &amp; Control Systems, Honors · Egypt 🇪🇬"</tspan></text></g>
  <g class="l l4"><text x="28" y="160"><tspan class="d">stack    </tspan><tspan class="o">TypeScript</tspan><tspan class="d"> · </tspan><tspan class="o">Node.js</tspan><tspan class="d"> · </tspan><tspan class="o">Next.js</tspan><tspan class="d"> · </tspan><tspan class="o">Flutter</tspan><tspan class="d"> · </tspan><tspan class="o">Python</tspan></text></g>
  <g class="l l5"><text x="28" y="186"><tspan class="d">builds   </tspan><tspan class="m">16+ production systems · 3,700+ participants</tspan></text></g>
  <g class="l l6"><text x="28" y="212"><tspan class="d">teams    </tspan><tspan class="k">@ieeeypegypt</tspan><tspan class="d"> · </tspan><tspan class="k">@ElyraTeam</tspan><tspan class="d"> · </tspan><tspan class="k">@IEEEManSB</tspan><tspan class="d"> · </tspan><tspan class="k">@CATReloaded</tspan></text></g>
  <g class="l l7"><text x="28" y="252"><tspan class="p">➜</tspan> <tspan class="k">~</tspan> <tspan class="c">cat status.txt</tspan></text></g>
  <g class="l l8"><text x="28" y="280"><tspan class="p">●</tspan> <tspan class="c">open to remote software engineering roles</tspan><tspan class="cur c"> ▍</tspan></text></g>
</svg>
